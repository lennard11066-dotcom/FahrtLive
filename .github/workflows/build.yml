
name: FahrtLive bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: iPhone-App kompilieren
        run: |
          xcodebuild \
            -project FahrtLive.xcodeproj \
            -scheme FahrtLive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: IPA-Datei erstellen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FahrtLive.app Payload/
          zip -qry FahrtLive.ipa Payload

      - name: Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FahrtLive-IPA
          path: FahrtLive.ipa
